services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ${STORAGE_LOCATION}:/app/storage
    environment:
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ${STORAGE_LOCATION}:/app/storage
      - ./frontend/dist:/srv
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
