services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /mnt/drive/hoard_data:/app/storage
    environment:
      - SESSION_SECRET_KEY=very_secret_key
      - USERNAME=admin
      - PASSWORD=password
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - /mnt/drive/hoard_data:/app/storage
      - ./frontend/dist:/srv
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
